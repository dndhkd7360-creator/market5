<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알뜰살뜰 시장 가계부</title>
    <!-- TailWind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR 스캐너 & QR 생성기 라이브러리 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">

    <!-- 상단 헤더 -->
    <header class="bg-indigo-600 text-white p-4 rounded-2xl shadow-lg flex justify-between items-center mb-4">
        <div>
            <h1 class="font-bold text-lg">🛒 알뜰살뜰 시장</h1>
            <p id="userInfo" class="text-xs text-indigo-200">로그인이 필요합니다</p>
        </div>
        <div class="flex gap-2">
            <button onclick="openQrGeneratorModal()" class="bg-indigo-500 hover:bg-indigo-700 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1 transition">
                <i class="fa-solid font-bold fa-qrcode"></i> QR 생성기
            </button>
            <button onclick="openTeacherModal()" class="bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1 transition">
                <i class="fa-solid fa-user-tie"></i> 선생님
            </button>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-grow space-y-4">

        <!-- 1. 학생 로그인 폼 -->
        <div id="loginSection" class="bg-white p-5 rounded-2xl shadow border border-slate-100">
            <h2 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-right-to-bracket text-indigo-600"></i> 학생 로그인
            </h2>
            <div class="grid grid-cols-3 gap-2 mb-3">
                <select id="loginGrade" class="p-2 border rounded-xl text-sm bg-slate-50"><option value="5">5학년</option></select>
                <select id="loginClass" class="p-2 border rounded-xl text-sm bg-slate-50">
                    <option value="1">1반</option><option value="2">2반</option>
                    <option value="3">3반</option><option value="4">4반</option><option value="5">5반</option>
                </select>
                <input type="number" id="loginNumber" placeholder="번호" class="p-2 border rounded-xl text-sm bg-slate-50">
            </div>
            <input type="text" id="loginName" placeholder="이름을 입력하세요" class="w-full p-2 border rounded-xl text-sm bg-slate-50 mb-3">
            <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-bold shadow hover:bg-indigo-700 transition">
                로그인 / 시작하기
            </button>
        </div>

        <!-- 2. 가계부 주요 기능 (로그인 시 표시) -->
        <div id="appSection" class="hidden space-y-4">
            
            <!-- 시드머니 & 잔액 카드 -->
            <div class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-4 rounded-2xl shadow flex justify-between items-center">
                <div>
                    <p class="text-xs text-emerald-100">현재 남은 잔액</p>
                    <p class="text-2xl font-black" id="currentBalance">32냥</p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-emerald-100">기본 시드머니</p>
                    <p class="text-sm font-bold">32냥</p>
                </div>
            </div>

            <!-- 거래 입력 (판매 / 구입) -->
            <div class="bg-white p-4 rounded-2xl shadow border border-slate-100 space-y-3">
                <div class="flex gap-2">
                    <button id="btnIncome" onclick="setTransactionType('income')" class="flex-1 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white">
                        <i class="fa-solid fa-plus-circle"></i> 판매하기 (수입)
                    </button>
                    <button id="btnExpense" onclick="setTransactionType('expense')" class="flex-1 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">
                        <i class="fa-solid fa-minus-circle"></i> 구입하기 (지출)
                    </button>
                </div>

                <!-- 판매 시에만 표시되는 QR 스캔 버튼 -->
                <div id="qrScanBox" class="block">
                    <button onclick="startScanner()" class="w-full py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                        <i class="fa-solid fa-camera"></i> 📷 QR 코드로 판매 물품 자동 입력
                    </button>
                </div>

                <!-- 입력 양식 -->
                <div class="space-y-2">
                    <input type="text" id="itemName" placeholder="물품 이름을 입력하세요" class="w-full p-2.5 border rounded-xl text-sm">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="itemPrice" placeholder="단가 (냥)" class="p-2.5 border rounded-xl text-sm">
                        <input type="number" id="itemQty" value="1" placeholder="수량" class="p-2.5 border rounded-xl text-sm">
                    </div>
                    <button onclick="addTransaction()" class="w-full bg-slate-800 text-white py-2.5 rounded-xl text-sm font-bold shadow hover:bg-slate-900 transition">
                        거래 기록 추가
                    </button>
                </div>
            </div>

            <!-- 거래 내역 리스트 -->
            <div class="bg-white p-4 rounded-2xl shadow border border-slate-100">
                <h3 class="font-bold text-slate-800 text-sm mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-receipt text-indigo-600"></i> 거래 내역
                </h3>
                <div id="transactionList" class="space-y-2 max-h-48 overflow-y-auto text-xs">
                    <p class="text-slate-400 text-center py-4">아직 내역이 없습니다.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 모달 1: QR 라벨 생성기 -->
    <div id="qrGenModal" class="modal">
        <div class="bg-white p-5 rounded-2xl max-w-xs w-full m-4 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-slate-800"><i class="fa-solid fa-qrcode text-indigo-600"></i> QR 라벨 생성기</h3>
                <button onclick="closeModal('qrGenModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-2">
                <input type="text" id="qrItemName" placeholder="물품명 (예: 공룡인형)" class="w-full p-2 border rounded-xl text-xs">
                <input type="number" id="qrItemPrice" placeholder="가격 (예: 500)" class="w-full p-2 border rounded-xl text-xs">
                <button onclick="generateQrCode()" class="w-full bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">QR 코드 만들기</button>
            </div>
            <div id="qrCodeContainer" class="flex flex-col items-center justify-center p-3 border rounded-xl bg-slate-50 min-h-[160px]">
                <p class="text-xs text-slate-400">물품명과 가격을 입력하세요</p>
            </div>
        </div>
    </div>

    <!-- 모달 2: 선생님 인증 모달 -->
    <div id="teacherAuthModal" class="modal">
        <div class="bg-white p-5 rounded-2xl max-w-xs w-full m-4 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-slate-800"><i class="fa-solid fa-lock text-indigo-600"></i> 선생님 인증</h3>
                <button onclick="closeModal('teacherAuthModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div>
                <p class="text-xs text-slate-500 mb-2">선생님 전용 비밀번호를 입력하세요.</p>
                <input type="password" id="teacherPassword" placeholder="비밀번호 입력 (기본: 1234)" class="w-full p-2 border rounded-xl text-xs mb-3">
                <button onclick="checkTeacherPassword()" class="w-full bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">확인</button>
            </div>
        </div>
    </div>

    <!-- 모달 3: 선생님 대시보드 -->
    <div id="teacherDashboardModal" class="modal">
        <div class="bg-white p-5 rounded-2xl max-w-sm w-full m-4 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-slate-800"><i class="fa-solid fa-chart-line text-indigo-600"></i> 선생님 전용 모드</h3>
                <button onclick="closeModal('teacherDashboardModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-bold text-slate-600">반 선택 보기:</label>
                    <select id="teacherClassFilter" onchange="renderTeacherDashboard()" class="p-1 border rounded text-xs bg-slate-50">
                        <option value="all">전체 학급</option>
                        <option value="1">1반</option><option value="2">2반</option>
                        <option value="3">3반</option><option value="4">4반</option><option value="5">5반</option>
                    </select>
                </div>
                <div id="teacherDataList" class="max-h-48 overflow-y-auto space-y-2 border p-2 rounded-xl text-xs bg-slate-50">
                    <!-- 데이터 렌더링 영역 -->
                </div>
                <button onclick="exportToCSV()" class="w-full bg-emerald-600 text-white py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1">
                    <i class="fa-solid fa-file-excel"></i> CSV 데이터 내보내기
                </button>
            </div>
        </div>
    </div>

    <!-- 모달 4: QR 카메라 스캐너 -->
    <div id="scannerModal" class="modal">
        <div class="bg-white p-4 rounded-2xl max-w-xs w-full m-4 shadow-2xl space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-xs text-slate-800">📷 QR 코드를 카메라에 대어주세요</h3>
                <button onclick="stopScanner()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="reader" class="w-full rounded-xl overflow-hidden bg-black"></div>
        </div>
    </div>

    <script>
        // 전역 상태
        let currentUser = null;
        let currentType = 'income'; // 'income' 또는 'expense'
        let records = JSON.parse(localStorage.getItem('market_records') || '[]');
        let html5QrCode = null;

        // 모달 열기/닫기
        function openQrGeneratorModal() {
            document.getElementById('qrGenModal').classList.add('active');
        }

        function openTeacherModal() {
            document.getElementById('teacherPassword').value = '';
            document.getElementById('teacherAuthModal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            if (id === 'scannerModal') stopScanner();
        }

        // 로그인
        function handleLogin() {
            const grade = document.getElementById('loginGrade').value;
            const cls = document.getElementById('loginClass').value;
            const num = document.getElementById('loginNumber').value;
            const name = document.getElementById('loginName').value.trim();

            if (!num || !name) {
                alert('번호와 이름을 입력해 주세요.');
                return;
            }

            currentUser = { grade, class: cls, number: num, name };
            document.getElementById('userInfo').innerText = `${grade}학년 ${cls}반 ${num}번 ${name}`;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            updateUI();
        }

        // 거래 타입 변경 (판매/구입)
        function setTransactionType(type) {
            currentType = type;
            const btnIncome = document.getElementById('btnIncome');
            const btnExpense = document.getElementById('btnExpense');
            const qrBox = document.getElementById('qrScanBox');

            if (type === 'income') {
                btnIncome.className = "flex-1 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white";
                btnExpense.className = "flex-1 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600";
                qrBox.classList.remove('hidden');
            } else {
                btnExpense.className = "flex-1 py-2 rounded-xl text-xs font-bold bg-rose-600 text-white";
                btnIncome.className = "flex-1 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600";
                qrBox.classList.add('hidden');
            }
        }

        // 거래 기록 추가
        function addTransaction() {
            if (!currentUser) return;
            const name = document.getElementById('itemName').value.trim();
            const price = parseInt(document.getElementById('itemPrice').value);
            const qty = parseInt(document.getElementById('itemQty').value) || 1;

            if (!name || isNaN(price) || price <= 0) {
                alert('올바른 물품 이름과 가격을 입력하세요.');
                return;
            }

            const total = price * qty;
            const record = {
                id: Date.now(),
                user: currentUser,
                type: currentType,
                name,
                price,
                qty,
                total,
                date: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
            };

            records.push(record);
            localStorage.setItem('market_records', JSON.stringify(records));

            // 입력 필드 초기화
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemQty').value = '1';

            updateUI();
        }

        // UI 업데이트
        function updateUI() {
            if (!currentUser) return;

            const myRecords = records.filter(r => 
                r.user.grade === currentUser.grade &&
                r.user.class === currentUser.class &&
                r.user.number === currentUser.number &&
                r.user.name === currentUser.name
            );

            let balance = 32; // 시드머니
            const listEl = document.getElementById('transactionList');
            listEl.innerHTML = '';

            if (myRecords.length === 0) {
                listEl.innerHTML = '<p class="text-slate-400 text-center py-4">아직 내역이 없습니다.</p>';
            } else {
                myRecords.forEach(r => {
                    if (r.type === 'income') balance += r.total;
                    else balance -= r.total;

                    const item = document.createElement('div');
                    item.className = `p-2.5 rounded-xl border flex justify-between items-center ${r.type === 'income' ? 'bg-indigo-50 border-indigo-100' : 'bg-rose-50 border-rose-100'}`;
                    item.innerHTML = `
                        <div>
                            <span class="font-bold ${r.type === 'income' ? 'text-indigo-700' : 'text-rose-700'}">[${r.type === 'income' ? '판매' : '구입'}] ${r.name}</span>
                            <span class="text-slate-400 text-[10px]">(${r.price}냥 × ${r.qty}개)</span>
                        </div>
                        <div class="text-right font-bold ${r.type === 'income' ? 'text-indigo-600' : 'text-rose-600'}">
                            ${r.type === 'income' ? '+' : '-'}${r.total}냥
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            }

            document.getElementById('currentBalance').innerText = `${balance}냥`;
        }

        // QR 라벨 생성 기능
        function generateQrCode() {
            const name = document.getElementById('qrItemName').value.trim();
            const price = document.getElementById('qrItemPrice').value.trim();
            const container = document.getElementById('qrCodeContainer');

            if (!name || !price) {
                alert('물품명과 가격을 모두 입력하세요.');
                return;
            }

            container.innerHTML = '';
            const qrData = `${name},${price}`;
            
            new QRCode(container, {
                text: qrData,
                width: 128,
                height: 128
            });

            const labelInfo = document.createElement('p');
            labelInfo.className = 'text-xs font-bold text-slate-700 mt-2';
            labelInfo.innerText = `${name} (${price}냥)`;
            container.appendChild(labelInfo);
        }

        // 선생님 인증 및 대시보드
        function checkTeacherPassword() {
            const pwd = document.getElementById('teacherPassword').value;
            if (pwd === '1234') {
                closeModal('teacherAuthModal');
                document.getElementById('teacherDashboardModal').classList.add('active');
                renderTeacherDashboard();
            } else {
                alert('비밀번호가 올바르지 않습니다.');
            }
        }

        function renderTeacherDashboard() {
            const clsFilter = document.getElementById('teacherClassFilter').value;
            const container = document.getElementById('teacherDataList');
            container.innerHTML = '';

            const filtered = records.filter(r => clsFilter === 'all' || r.user.class === clsFilter);

            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center py-2">기록된 데이터가 없습니다.</p>';
                return;
            }

            filtered.forEach(r => {
                const row = document.createElement('div');
                row.className = 'p-1.5 border-b text-[11px] flex justify-between';
                row.innerHTML = `
                    <span>${r.user.class}반 ${r.user.number}번 ${r.user.name}</span>
                    <span class="${r.type === 'income' ? 'text-indigo-600' : 'text-rose-600'} font-bold">
                        ${r.type === 'income' ? '판매' : '구입'}: ${r.name} (${r.total}냥)
                    </span>
                `;
                container.appendChild(row);
            });
        }

        function exportToCSV() {
            if (records.length === 0) {
                alert('내보낼 데이터가 없습니다.');
                return;
            }

            let csv = '\uFEFF학년,반,번호,이름,구분,물품명,단가,수량,총금액,시간\n';
            records.forEach(r => {
                csv += `${r.user.grade},${r.user.class},${r.user.number},"${r.user.name}",${r.type === 'income' ? '판매' : '구입'},"${r.name}",${r.price},${r.qty},${r.total},"${r.date}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `알뜰시장_가계부_기록.csv`;
            link.click();
        }

        // QR 스캐너 기능
        function startScanner() {
            document.getElementById('scannerModal').classList.add('active');
            html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 200, height: 200 } },
                (decodedText) => {
                    const parts = decodedText.split(',');
                    if (parts.length >= 2) {
                        document.getElementById('itemName').value = parts[0].trim();
                        document.getElementById('itemPrice').value = parts[1].trim();
                        stopScanner();
                    } else {
                        alert('올바른 물품 QR 코드가 아닙니다.');
                    }
                },
                () => {} // 스캔 실패시 무시
            ).catch(err => {
                alert('카메라 접근 권한이 필요합니다.');
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    closeModal('scannerModal');
                }).catch(() => {
                    closeModal('scannerModal');
                });
            } else {
                closeModal('scannerModal');
            }
        }
    </script>
</body>
</html>
